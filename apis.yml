apis:
- name: Definite API
  description: >-
    The Definite REST API for programmatic access to the Definite data platform:
    stream JSON ingestion into DuckLake, signed-URL file uploads to Definite
    Drive, webhook-triggered Python pipelines, push-based data ingestion, and
    embedding of Docs and data apps. Authenticated with a bearer API key; the
    platform also exposes a native Model Context Protocol (MCP) server.
